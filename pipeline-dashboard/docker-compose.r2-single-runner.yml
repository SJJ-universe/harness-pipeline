# Slice R2-1 (Phase D R2 deployment evaluation, 2026-04-28)
# Updated: Slice R3-a (Phase D R3, 2026-04-28) — two-network topology.
#
# Single-runner evaluation harness. NOT for production.
#
# Network topology (R3-a):
#
#   harness-r2-operator   non-internal bridge, host port mapping path.
#                         Orchestrator only — runner and probe are NOT
#                         attached. Dashboard reachability via host
#                         loopback (127.0.0.1:4201) routes through this
#                         bridge.
#   harness-r2-runner     internal-eligible bridge, intra-container
#                         traffic. Orchestrator + runner + probe attach.
#                         R3 strict override flips ONLY this bridge to
#                         internal:true so runner egress is severed
#                         while the dashboard host port survives.
#
# Why two networks (R3-a, closes R2-4 dashboard host port gap):
# Docker's `internal: true` breaks the host port NAT in both directions.
# Pre-R3-a, strict mode (R2-4) made `curl http://127.0.0.1:4201` from
# the host return 000 because there was a single bridge and that bridge
# was internal. R3-a separates the operator-facing dashboard path from
# the runner-facing intra-bridge path, so strict mode can sever runner
# egress without taking the dashboard with it.
#
# What this brings up:
#
#   orchestrator   — Node 24 container running server.js, dashboard at
#                    http://127.0.0.1:4201 (loopback only). Listens on
#                    0.0.0.0:4201 inside the container; the host's port
#                    publishing pins it to loopback. HARNESS_TOKEN gates
#                    the dashboard surface; runner subsystem (preview)
#                    has its own Bearer-based auth. **Dual-homed**:
#                    attached to both bridges so the dashboard reaches
#                    the host AND the runner reaches the orchestrator.
#   runner         — Node 24 container running harness-runner. Connects
#                    to orchestrator via Docker DNS (http://orchestrator).
#                    Attached ONLY to harness-r2-runner — never to the
#                    operator bridge. /work/in is the (operator-supplied)
#                    read-only mount point; /work/out is tmpfs (no
#                    persistence, nothing written by the runner survives
#                    container restart).
#   probe          — alpine:3.20 sidecar on the runner-internal network
#                    (NOT the operator network — the probe tests
#                    runner-bridge isolation, so it must sit where the
#                    runner sits). Profiled — only spins up when invoked
#                    with --profile probe. Used by R2-4 / R3-a strict
#                    probes (169.254 / RFC1918 / public host blocking).
#
# Lifecycle (manual; this is NOT in CI):
#
#   1. Copy .env.r2.example → .env.r2 and fill in real values.
#   2. ./scripts/r2-up.sh  (Linux/WSL/Git Bash)
#      pwsh -File scripts/r2-up.ps1  (Windows native)
#   3. Inspect logs / poke endpoints.
#   4. ./scripts/r2-eval.sh  (runs the smoke check)
#   5. ./scripts/r2-down.sh
#
# The orchestrator binds dashboard on 127.0.0.1:4201 (host loopback only).
# An operator who wants to view the dashboard runs:
#
#   curl http://127.0.0.1:4201/api/health
#
# from the same host. Cross-LAN access is blocked at the docker port
# publish layer.

services:
  orchestrator:
    container_name: harness-orchestrator-r2
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    environment:
      # HKDF IKM. derives jwtKey + ledgerKey with domain separation
      # (info=runner-jwt vs info=audit-ledger).
      HARNESS_TOKEN: "${HARNESS_TOKEN:?HARNESS_TOKEN is required — copy .env.r2.example to .env.r2 and fill it in}"
      # preview = full subsystem on (HKDF-derived keys, runner registry,
      # routes mounted). off = subsystem dormant; routes 404.
      HARNESS_REMOTE_MODE: "${HARNESS_REMOTE_MODE:-preview}"
      # Slice R2.5-c: hook execution bridge mode.
      # off (default) — broadcast-only (R1/R2 behavior).
      # report — sanitization runs, audit emits sanitized/rejected, NO dispatch.
      # dispatch — sanitized hooks forwarded to local executor methods
      #            (Pre/PostToolUse for Read/Grep/Glob, Stop, SubagentStart/Stop).
      HARNESS_REMOTE_BRIDGE_MODE: "${HARNESS_REMOTE_BRIDGE_MODE:-off}"
      # Bootstrap mapping: orchestrator looks up env var
      # HARNESS_REMOTE_RUNNER_TOKEN_<sanitized-host>. Sanitize: replace
      # any non-alnum with '_'. For HARNESS_HOST_IDENTITY=runner-r2-001
      # the env var is HARNESS_REMOTE_RUNNER_TOKEN_runner_r2_001.
      HARNESS_REMOTE_RUNNER_TOKEN_runner_r2_001: "${RUNNER_BOOTSTRAP_TOKEN:?RUNNER_BOOTSTRAP_TOKEN is required}"
      PORT: "4201"
      # server.js: ALLOW_REMOTE = HARNESS_ALLOW_REMOTE === "1". Must be
      # the literal string "1" — "true" / true / yes / on do NOT work.
      HARNESS_ALLOW_REMOTE: "1"
    ports:
      # Loopback-only publish — the only way for the host to reach the
      # dashboard is via 127.0.0.1:4201. Cross-LAN blocked.
      - "127.0.0.1:4201:4201"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4201/api/health',{timeout:2000},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 8
      start_period: 6s
    networks:
      # R3-a: dual-homed. Operator bridge (host port path) + runner
      # bridge (intra-container talk to runner/probe). Strict override
      # flips ONLY harness-r2-runner to internal:true.
      - harness-r2-operator
      - harness-r2-runner
    volumes:
      # Persist the evidence ledger + run registry across container
      # restarts so audit chains survive an orchestrator bounce.
      # /app/runs is the rootDir for both RunRegistry and EvidenceLedger;
      # see server.js (`runsDir = path.join(REPO_ROOT, "runs")`).
      - r2-evidence:/app/runs
    restart: "no"  # eval harness — no auto-restart
    cap_drop: ["ALL"]
    security_opt:
      - "no-new-privileges:true"

  runner:
    container_name: harness-runner-r2
    build:
      context: .
      dockerfile: Dockerfile.runner
    environment:
      HARNESS_HOST_IDENTITY: "${HARNESS_HOST_IDENTITY:-runner-r2-001}"
      HARNESS_BOOTSTRAP_TOKEN: "${RUNNER_BOOTSTRAP_TOKEN:?RUNNER_BOOTSTRAP_TOKEN is required}"
      # Docker DNS resolves "orchestrator" to the orchestrator service IP.
      HARNESS_ORCHESTRATOR_URL: "http://orchestrator:4201"
      HARNESS_RUN_ID: "${HARNESS_RUN_ID:-rr-r2-eval-001}"
      # Pre-issued by scripts/r2-up.{sh,ps1}; written into .env.r2.
      HARNESS_RUN_JWT: "${HARNESS_RUN_JWT:?HARNESS_RUN_JWT is required (run scripts/r2-up to issue)}"
      HARNESS_SANDBOX_CLASS: "container-strict"
      # Slow heartbeat for eval — keeps logs readable. Real deployments
      # would tighten this.
      HARNESS_HEARTBEAT_INTERVAL_MS: "5000"
    depends_on:
      orchestrator:
        condition: service_healthy
    networks:
      # R3-a: runner-internal bridge ONLY. Never the operator bridge —
      # runner attached to operator would defeat egress isolation.
      - harness-r2-runner
    tmpfs:
      # MG1 §2.1: /work/out is tmpfs, sized + noexec. R2-5 verifies.
      - /work/out:rw,noexec,size=64m
    # /work/in is read-only mount placeholder — operator supplies on
    # demand. R1 doesn't run user code so this is empty for the eval.
    read_only: false  # /tmp + /work/out tmpfs need write
    cap_drop: ["ALL"]
    security_opt:
      - "no-new-privileges:true"
    restart: "no"

  # R2-4 probe sidecar. Profiled — `docker compose up` does NOT start it
  # by default. To activate:
  #   docker compose -f docker-compose.r2-single-runner.yml --profile probe up -d probe
  # Then exec into it for network reachability tests:
  #   docker exec -it harness-probe-r2 sh
  probe:
    container_name: harness-probe-r2
    image: alpine:3.20
    profiles: ["probe"]
    command: ["sleep", "infinity"]
    networks:
      # R3-a: probe sits where the runner sits, on the same internal-
      # eligible bridge. Tests run from the probe verify what a
      # workload would see, not what the orchestrator sees.
      - harness-r2-runner
    cap_drop: ["ALL"]
    security_opt:
      - "no-new-privileges:true"
    restart: "no"

networks:
  # R3-a: operator-facing bridge — non-internal. Host port mapping
  # (127.0.0.1:4201:4201 on the orchestrator) routes through here.
  # NOT touched by the strict override; dashboard reachability survives
  # strict mode.
  harness-r2-operator:
    name: harness-r2-operator-network
    driver: bridge

  # R3-a: runner-internal bridge — eligible for `internal: true` via
  # the strict override. Orchestrator + runner + probe all attach;
  # intra-container traffic is unaffected by the internal flag (Docker
  # only severs the host-gateway NAT, not container-to-container).
  harness-r2-runner:
    name: harness-r2-runner-network
    driver: bridge
    # R2-1 baseline — open egress (default Docker behavior). R2-4 +
    # R3-a strict variants via the override file flip this to
    # `internal: true`. R3-b will add nftables sidecar + dnsmasq
    # controlled resolver on a real Linux host.

volumes:
  r2-evidence:
    name: harness-r2-evidence
