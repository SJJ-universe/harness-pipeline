<!DOCTYPE html>
<!--
  index.html — SJ Orchestrator product shell (Slice UI-P1, Phase 2 Round 3, 2026-04-30).

  This is the NEW first-paint experience. The visual shape is ported
  from the reference HTML at the operator's design-source folder
  (verified in docs/ui-reference-port-plan.md):
    - 52px header (logo + status pill + Simple/Pro + KO/EN + indicators + actions)
    - 92px Harness Track (sprite player + 7-stage band + status pill)
    - 2-column workspace: pipeline rail + (monitor grid stacked over dual terminals)

  Default mode is `simple` per Section 7 sign-off (reference defaults pro;
  production prefers lower density on first visit). Operators who want
  the dense pro view click the toggle or pass `?mode=pro`.

  ?mode=legacy redirects (via server-side branch in server.js) to
  index.legacy.html — the preserved pre-port markup. The legacy view
  stays available indefinitely (sign-off decision 6).

  Mount sequencing:
    1. Core runtime modules (dom / i18n / api-client / ws-client) load
       first — these power both the product shell and existing modals.
    2. Monitor infrastructure (store / normalizer / legacy-bridge / mode)
       loads next — the product shell consumes the same store the legacy
       monitor uses.
    3. Product panels load — these are NEW and prefixed `product-*` to
       avoid name collisions with legacy panels (which keep their
       original names).
    4. Init script resolves mode + mounts.

  CSP: every <script> + <link rel="stylesheet"> gets a per-request nonce
  injected by server.js indexRenderer. No inline <script> contents.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SJ Orchestrator</title>
  <!-- Reference-derived design tokens (UI-P1-c). Pixel polish lands in UI-P2. -->
  <link rel="stylesheet" href="style.product.css" />
</head>
<body>
  <a class="skip-link" href="#product-shell-root" data-i18n="a11y.skipLink">본문 바로가기</a>

  <!-- Single mount point. The product-shell.js mount() call paints
       the entire 5-region shell into this div. No legacy DOM lives
       in this file — operators who want the legacy view use
       /?mode=legacy which the server routes to index.legacy.html. -->
  <div id="product-shell-root" role="main" aria-label="SJ Orchestrator Dashboard"></div>

  <!-- ────────────────────────────────────────────────────────────
       Core runtime (shared with legacy view)
       ──────────────────────────────────────────────────────────── -->
  <script src="js/dom.js"></script>
  <script src="js/i18n/ko.js"></script>
  <script src="js/i18n/en.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/api-client.js"></script>
  <script src="js/ws-client.js"></script>

  <!-- ────────────────────────────────────────────────────────────
       Event dispatcher — must load BEFORE legacy-bridge.js (the
       bridge subscribes to it via addTap) and BEFORE the WS client
       initializer in product-shell-init.js (which calls .dispatch
       on every incoming event so the bridge's wildcard tap fires
       and store updates flow). The legacy view ships this in
       index.legacy.html:419; without it here the product shell
       receives WS events that go nowhere → status pill stays
       "대기 중" forever after a run starts.
       ──────────────────────────────────────────────────────────── -->
  <script src="js/event-dispatcher.js"></script>

  <!-- ────────────────────────────────────────────────────────────
       Monitor infrastructure (DOM-free store + normalizer + bridge)
       ──────────────────────────────────────────────────────────── -->
  <script src="js/monitor/store.js"></script>
  <script src="js/monitor/normalizer.js"></script>
  <script src="js/monitor/hydrate.js"></script>
  <script src="js/monitor/legacy-bridge.js"></script>
  <script src="js/monitor/mode.js"></script>

  <!-- ────────────────────────────────────────────────────────────
       Product shell + panels (UI-P1)
       ──────────────────────────────────────────────────────────── -->
  <!-- UI-P5-a: pure selector module. Each panel reads
       window.OrchestratorProductShellData at create() time so the panels
       stay testable with stub selectors injected via opts.dataSelectors. -->
  <script src="js/monitor/product-shell-data.js"></script>
  <!-- UI-P6: review-relay HTTP client. Loaded BEFORE product-shell
       so product-shell-init.js can resolve window.OrchestratorReviewSessionClient
       and pass it into the dual-terminals action row. Backwards-compat:
       if this script is missing, the action row is omitted and the
       terminals stay in mock-only view. -->
  <script src="js/monitor/review-session-client.js"></script>
  <script src="js/monitor/panels/product-header.js"></script>
  <!-- UI-P3-b: horse rider sprite player. Must load BEFORE
       product-harness-track.js because the track resolves
       window.OrchestratorProductHorseRider at create() time. -->
  <script src="js/monitor/panels/product-horse-rider.js"></script>
  <script src="js/monitor/panels/product-harness-track.js"></script>
  <script src="js/monitor/panels/product-pipeline-rail.js"></script>
  <script src="js/monitor/panels/product-monitor-grid.js"></script>
  <script src="js/monitor/panels/product-dual-terminals.js"></script>
  <!-- AGENT-DESKTOP-0-c (2026-05-06): chat panel.
       Mounted by product-shell.js below the workspace as a sticky
       bottom strip. Loads after the existing panels so the shell
       module sees window.OrchestratorProductChatPanel during mount. -->
  <script src="js/monitor/panels/product-chat-panel.js"></script>
  <script src="js/monitor/shells/product-shell.js"></script>

  <!-- ────────────────────────────────────────────────────────────
       PRODUCT-SHELL-WIRING (Phase 2 v2 follow-up, 2026-05-06)
       Action surface — must load BEFORE product-shell-init.js so
       window.OrchestratorShellActions exists when the dispatcher map is
       built. focus-trap is consumed by general-pipeline-modal's
       lazy-DOM mode (operator types task → modal opens here without
       app.js, so the trap install lives in this script chain).
       ──────────────────────────────────────────────────────────── -->
  <script src="js/focus-trap.js"></script>
  <script src="js/general-pipeline-modal.js"></script>
  <script src="js/monitor/shell-actions.js"></script>

  <!-- ────────────────────────────────────────────────────────────
       Init — resolve mode + mount the product shell
       ──────────────────────────────────────────────────────────── -->
  <script src="js/product-shell-init.js"></script>
</body>
</html>
